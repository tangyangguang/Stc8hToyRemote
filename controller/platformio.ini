    -DTOY_REMOTE_ENABLE_UNPACK_CONTROL=0
    -DTOY_REMOTE_ENABLE_PACK_STATUS=0
    -DTOY_REMOTE_ENABLE_UNPACK_STATUS=0
    -DDRV_EC11_ENABLE_FULL_API=0
    -DDRV_EC11_ENABLE_SMALL_API=1
    -DDRV_EC11_SMALL_STEPS_PER_DETENT=4
    -DDRV_EC11_SMALL_REVERSE=0
    -DDRV_EC11_ENABLE_NULL_CHECK=0
    -DDRV_NRF24L01_ENABLE_READ_FIFO_STATUS=0
