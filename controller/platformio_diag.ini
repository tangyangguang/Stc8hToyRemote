[platformio]
extra_configs = platformio.ini
default_envs = STC8H1K08_diag

[env:STC8H1K08_diag]
extends = env:STC8H1K08
build_flags =
    ${env:STC8H1K08.build_flags}
    -DAPP_INPUT_DIAG_DISPLAY=1
    -DAPP_STARTUP_DISPLAY_TEST=1

[env:STC8H1K08_display_diag]
extends = env:STC8H1K08
build_flags =
    ${env:STC8H1K08.build_flags}
    -DAPP_DISABLE_RADIO=1

[env:STC8H1K08_tm1637_static_diag]
extends = env:STC8H1K08
build_flags =
    ${env:STC8H1K08.build_flags}
    -DAPP_DISABLE_RADIO=1
    -DAPP_STATIC_DISPLAY_DIAG=1

[env:STC8H1K08_tm1637_frame_diag]
extends = env:STC8H1K08
build_flags =
    ${env:STC8H1K08.build_flags}
    -DAPP_DISABLE_RADIO=1
    -DAPP_FRAME_DISPLAY_DIAG=1
