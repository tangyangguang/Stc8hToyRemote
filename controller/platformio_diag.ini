[platformio]
extra_configs = platformio.ini
default_envs = STC8H1K08_diag

[env:STC8H1K08_diag]
extends = env:STC8H1K08
build_flags =
    ${env:STC8H1K08.build_flags}
    -DAPP_INPUT_DIAG_DISPLAY=1
    -DAPP_STARTUP_DISPLAY_TEST=1

[env:STC8H1K08_display_diag]
extends = env:STC8H1K08
build_flags =
    ${env:STC8H1K08.build_flags}
    -DAPP_DISABLE_RADIO=1

[env:STC8H1K08_tm1637_static_diag]
extends = env:STC8H1K08
build_flags =
    ${env:STC8H1K08.build_flags}
    -DAPP_DISABLE_RADIO=1
    -DAPP_STATIC_DISPLAY_DIAG=1

[env:STC8H1K08_tm1637_frame_diag]
extends = env:STC8H1K08
build_flags =
    ${env:STC8H1K08.build_flags}
    -DAPP_DISABLE_RADIO=1
    -DAPP_FRAME_DISPLAY_DIAG=1

[env:STC8H1K08_radio_diag]
extends = env:STC8H1K08
build_src_filter =
    +<radio_diag_main.c>
    +<app_radio.c>
    +<drv_nrf24l01_wrap.c>
    +<drv_tm1637_wrap.c>
    +<stc8h_delay_wrap.c>
    +<stc8h_spi_wrap.c>
build_unflags =
    -DDRV_NRF24L01_ENABLE_READ_DYNAMIC_PAYLOAD_SIZE=0
build_flags =
    ${env:STC8H1K08.build_flags}
    -DAPP_RADIO_LINK_DIAG_MAIN=1
    -DAPP_RADIO_ENABLE_TX_DIAG_STATUS=1
    -DDRV_NRF24L01_ENABLE_READ_DYNAMIC_PAYLOAD_SIZE=1
