[platformio]
extra_configs = platformio.ini
default_envs = STC8H1K08_motor_diag

[env:STC8H1K08_motor_diag]
extends = env:STC8H1K08
build_src_filter =
    +<motor_diag_main.c>
    +<app_outputs.c>
    +<stc8h_delay_wrap.c>
    +<stc8h_pwm_wrap.c>
build_flags =
    ${env:STC8H1K08.build_flags}
    -DAPP_RECEIVER_MOTOR_DIAG_MAIN=1

[env:STC8H1K08_control_diag]
extends = env:STC8H1K08
build_src_filter =
    +<control_diag_main.c>
    +<app_outputs.c>
    +<app_radio.c>
    +<drv_nrf24l01_wrap.c>
    +<proto_rf_link_wrap.c>
    +<stc8h_delay_wrap.c>
    +<stc8h_pwm_wrap.c>
    +<stc8h_spi_wrap.c>
build_flags =
    ${env:STC8H1K08.build_flags}
    -DAPP_RECEIVER_CONTROL_DIAG_MAIN=1

[env:STC8H1K08_radio_motor_diag]
extends = env:STC8H1K08
build_src_filter =
    +<radio_motor_diag_main.c>
    +<app_outputs.c>
    +<app_radio.c>
    +<drv_nrf24l01_wrap.c>
    +<stc8h_delay_wrap.c>
    +<stc8h_pwm_wrap.c>
    +<stc8h_spi_wrap.c>
build_flags =
    ${env:STC8H1K08.build_flags}
    -DAPP_RECEIVER_RADIO_MOTOR_DIAG_MAIN=1

[env:STC8H1K08_spi_motor_diag]
extends = env:STC8H1K08
build_src_filter =
    +<motor_path_diag_main.c>
    +<app_outputs.c>
    +<stc8h_delay_wrap.c>
    +<stc8h_pwm_wrap.c>
    +<stc8h_spi_wrap.c>
build_flags =
    ${env:STC8H1K08.build_flags}
    -DAPP_RECEIVER_MOTOR_PATH_DIAG_MAIN=1
    -DMOTOR_PATH_DIAG_BOOT_BLINKS=1
    -DMOTOR_PATH_DIAG_INIT_SPI=1

[env:STC8H1K08_nrfpins_after_outputs_motor_diag]
extends = env:STC8H1K08
build_src_filter =
    +<motor_path_diag_main.c>
    +<app_outputs.c>
    +<drv_nrf24l01_wrap.c>
    +<stc8h_delay_wrap.c>
    +<stc8h_pwm_wrap.c>
    +<stc8h_spi_wrap.c>
build_flags =
    ${env:STC8H1K08.build_flags}
    -DAPP_RECEIVER_MOTOR_PATH_DIAG_MAIN=1
    -DMOTOR_PATH_DIAG_BOOT_BLINKS=2
    -DMOTOR_PATH_DIAG_INIT_SPI=1
    -DMOTOR_PATH_DIAG_INIT_NRF_PINS_AFTER_OUTPUTS=1

[env:STC8H1K08_radio_reinit_motor_diag]
extends = env:STC8H1K08
build_src_filter =
    +<motor_path_diag_main.c>
    +<app_outputs.c>
    +<app_radio.c>
    +<drv_nrf24l01_wrap.c>
    +<stc8h_delay_wrap.c>
    +<stc8h_pwm_wrap.c>
    +<stc8h_spi_wrap.c>
build_flags =
    ${env:STC8H1K08.build_flags}
    -DAPP_RECEIVER_MOTOR_PATH_DIAG_MAIN=1
    -DMOTOR_PATH_DIAG_BOOT_BLINKS=3
    -DMOTOR_PATH_DIAG_INIT_NRF_PINS_BEFORE_OUTPUTS=1
    -DMOTOR_PATH_DIAG_INIT_SPI=1
    -DMOTOR_PATH_DIAG_INIT_RADIO=1
    -DMOTOR_PATH_DIAG_REINIT_OUTPUTS_AFTER_RADIO=1

[env:STC8H1K08_control_gpio_diag]
extends = env:STC8H1K08
build_src_filter =
    +<control_gpio_diag_main.c>
    +<app_radio.c>
    +<drv_nrf24l01_wrap.c>
    +<proto_rf_link_wrap.c>
    +<stc8h_spi_wrap.c>
build_flags =
    ${env:STC8H1K08.build_flags}
    -DAPP_RECEIVER_CONTROL_GPIO_DIAG_MAIN=1
