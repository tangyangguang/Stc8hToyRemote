[env:STC8H1K08]
platform = intel_mcs51
board = STC8H1K08
build_flags =
    -Isrc
    -I../../Stc8hBase/core
    -I../../Stc8hBase/hal
    -I../../Stc8hBase/drivers
    -I../../Stc8hBase/protocols
    -I../shared
    -DSTC8H_CONFIG_INCLUDE=\"board_config.h\"
    -DSTC8H_PINS_INCLUDE=\"board_pins.h\"
    -DPROTO_RF_LINK_ENABLE_RESET=0
    -DPROTO_RF_LINK_ENABLE_TICK=0
    -DPROTO_RF_LINK_ENABLE_CONNECT=0
    -DPROTO_RF_LINK_ENABLE_SEND_DATA=0
    -DPROTO_RF_LINK_ENABLE_SEND_STATUS=0
    -DPROTO_RF_LINK_ENABLE_SEND_HEARTBEAT=0
    -DPROTO_RF_LINK_ENABLE_POLL=1
    -DPROTO_RF_LINK_ENABLE_GET_STATE=0
    -DTOY_REMOTE_ENABLE_CONTROL_SET_SAFE=1
    -DTOY_REMOTE_ENABLE_CONTROL_APPLY_BRAKE=0
    -DTOY_REMOTE_ENABLE_CONTROL_SET_STEERING_FROM_ADC=0
    -DTOY_REMOTE_ENABLE_CONTROL_ADJUST_SPEED=0
    -DTOY_REMOTE_ENABLE_STATUS_SET_VOLTAGE=0
    -DTOY_REMOTE_ENABLE_VALIDATE_CONTROL=1
    -DTOY_REMOTE_ENABLE_VALIDATE_STATUS=0
    -DTOY_REMOTE_ENABLE_PACK_CONTROL=0
    -DTOY_REMOTE_ENABLE_UNPACK_CONTROL=1
    -DTOY_REMOTE_ENABLE_PACK_STATUS=0
    -DTOY_REMOTE_ENABLE_UNPACK_STATUS=0
